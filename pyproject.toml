[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axisforge-design-studies"
version = "0.3.0"
description = "Validation cases, examples and engineering studies built on AxisForge (and SlipPY)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "ipython",
]
# axisforge and slippy are NOT listed: neither is on PyPI. Install both
# separately with `pip install -e <repo>` (see README.md#setup).

[project.optional-dependencies]
dev = ["pytest", "jupytext"]

# The bridge and the studies are packages: a case is imported as studies.<level>.<case> (D-0036).
[tool.setuptools.packages.find]
include = ["slippy_bridge*", "studies*"]

[tool.pytest.ini_options]
testpaths = ["tests", "studies"]
pythonpath = ["tests"]
addopts = "-q --import-mode=importlib"
markers = ["slow: a test that runs a solver at full size (deselect with -m 'not slow')"]
